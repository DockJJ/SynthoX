# coturn configuration for SynthoX WebRTC TURN/STUN

listening-port=3478
tls-listening-port=5349

# Realm
realm=synthox.local

# Shared-secret authentication (REST API method for WebRTC clients)
use-auth-secret
static-auth-secret=synthox_coturn_shared_secret_key_change_in_production

# UDP relay port range
min-port=49152
max-port=49200

# Fingerprint in TURN messages
fingerprint

# Long-term credential mechanism
lt-cred-mech

# Logging
verbose
no-stdout-log
simple-log
